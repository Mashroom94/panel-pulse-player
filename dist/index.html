<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071019">
  <meta name="description" content="Интерактивный 3D-плеер: музыка меняет атмосферу и зажигает окна панельного дома.">
  <title>Panel Pulse 3D</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23071019'/%3E%3Cpath d='M13 12h38v40H13z' fill='%23384043'/%3E%3Cg fill='%2346a8ff'%3E%3Cpath d='M19 19h7v6h-7zM31 19h7v6h-7zM43 19h4v6h-4zM19 31h7v6h-7zM31 31h7v6h-7zM43 31h4v6h-4zM19 43h7v5h-7zM31 43h7v5h-7zM43 43h4v5h-4z'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.js"}}
  </script>
  <script>
    window.addEventListener('error', event => {
      const box = document.getElementById('webglError');
      if (box) { box.hidden = false; box.textContent = `Ошибка 3D: ${event.message}`; }
    });
    window.addEventListener('unhandledrejection', event => {
      const box = document.getElementById('webglError');
      if (box) { box.hidden = false; box.textContent = `Ошибка 3D: ${event.reason?.message || event.reason}`; }
    });
  </script>
</head>
<body>
  <main id="experience" aria-label="Интерактивная трёхмерная сцена музыкального плеера">
    <canvas id="stage" aria-hidden="true"></canvas>
    <p id="webglError" role="alert" hidden>3D-сцена недоступна в этом браузере.</p>
    <section class="sr-only" aria-label="Управление музыкальным плеером">
      <p id="a11yNow" aria-live="polite">Трек не запущен</p>
      <button id="a11yPlay">Воспроизвести или поставить на паузу</button>
      <button id="a11yPrev">Предыдущий трек</button>
      <button id="a11yNext">Следующий трек</button>
      <button id="a11yUp">Увеличить громкость</button>
      <button id="a11yDown">Уменьшить громкость</button>
      <button id="a11yAll">Показать все треки</button>
    </section>
    <audio id="audio" preload="metadata"></audio>
  </main>
  <script type="module">
    import('./app.js?v=3d3').catch(error => {
      const box = document.getElementById('webglError');
      box.hidden = false;
      box.textContent = `Ошибка 3D: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
