<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1219">
  <meta name="description" content="Аудиореактивный плеер: музыка меняет погоду и зажигает окна панельного дома.">
  <title>Panel Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="mood-sad" data-color="blue">
  <main class="scene" aria-label="Аудиореактивная сцена с панельным домом">
    <div class="scene-art" aria-hidden="true">
      <img src="assets/panel-house-clean.png" alt="" class="house-photo">
      <div class="atmosphere"></div>
      <div class="sunbeams"></div>
      <div class="window-field" id="windowField"></div>
    </div>
    <canvas id="weather" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <section class="device-zone" aria-label="Карманный музыкальный плеер">
      <div class="device" id="device">
        <img src="assets/hand-player-v4.png" alt="Рука держит компактный карманный музыкальный плеер" draggable="false">

        <div class="device-screen">
          <div class="now-screen" id="nowScreen">
            <div class="screen-top">
              <span id="screenIndex">6</span>
              <div class="now-actions">
                <button class="now-delete-button" id="nowDeleteButton" type="button" aria-label="Удалить текущий трек" title="Удалить текущий трек" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 7.5h13M9 7.5V5.2h6v2.3m-7.7 0 .7 11h8l.7-11M10 10.5v5M14 10.5v5"/></svg>
                </button>
                <button class="all-button" id="allButton" type="button" aria-label="Открыть библиотеку треков">ALL <span aria-hidden="true">›</span></button>
              </div>
            </div>
            <div class="screen-title-row">
              <div class="screen-title" id="screenTitle">IN CONFUSION</div>
              <span class="screen-volume">VOL <b id="volumeText">78</b></span>
            </div>
            <div class="screen-artist" id="screenArtist">RAREERRA</div>
            <div class="equalizer" id="equalizer" aria-hidden="true"></div>
            <div class="progress-row">
              <span id="elapsed">0:00</span>
              <button class="screen-progress" id="seek" aria-label="Перемотать трек"><i id="screenProgress"></i></button>
              <span id="duration">0:00</span>
            </div>
            <div class="screen-bottom">
              <button class="favorite-button" id="favoriteButton" type="button" aria-label="Добавить текущий трек в избранное" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2 4.3 13A5.1 5.1 0 0 1 11.5 5.8l.5.5.5-.5A5.1 5.1 0 0 1 19.7 13Z"/></svg>
              </button>
              <div class="color-picker">
                <div class="screen-swatches" role="group" aria-label="Цвет подсветки окон">
                  <button class="screen-swatch active" data-color="blue" style="--swatch:#46a8ff" aria-label="Синий" aria-pressed="true"></button>
                  <button class="screen-swatch" data-color="green" style="--swatch:#48f78b" aria-label="Зелёный" aria-pressed="false"></button>
                  <button class="screen-swatch" data-color="pink" style="--swatch:#ff4fb7" aria-label="Розовый" aria-pressed="false"></button>
                  <button class="screen-swatch" data-color="yellow" style="--swatch:#ffe44f" aria-label="Жёлтый" aria-pressed="false"></button>
                  <button class="screen-swatch" data-color="orange" style="--swatch:#ff7b32" aria-label="Оранжевый" aria-pressed="false"></button>
                </div>
                <span class="color-hint">ВЫБЕРИ ЦВЕТ</span>
              </div>
            </div>
          </div>
          <div class="all-screen" id="allScreen" hidden>
            <div class="all-actions">
              <button id="allClose" type="button" aria-label="Вернуться к текущему треку">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 4 3 10l6 6M3.5 10H17"/></svg>
                <span>BACK</span>
              </button>
              <div class="library-tools">
                <button id="searchButton" type="button" aria-label="Найти трек или альбом" title="Поиск">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.8"/><path d="m15 15 4.5 4.5"/></svg>
                </button>
                <button id="uploadButton" type="button" aria-label="Добавить треки с компьютера" title="Добавить свои треки">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path class="upload-note" d="M12.5 5.5v10.2m0-7.4L19 6.7v7.8M12.5 8.3 19 6.7"/>
                    <circle class="upload-note" cx="10.1" cy="16.9" r="2.3"/>
                    <circle class="upload-note" cx="16.6" cy="15.7" r="2.3"/>
                    <path class="upload-plus" d="M5 3.5v6M2 6.5h6"/>
                  </svg>
                </button>
              </div>
              <input id="trackUpload" type="file" accept="audio/*" multiple hidden>
              <input id="albumUpload" type="file" accept="audio/*" webkitdirectory directory multiple hidden>
            </div>
            <div class="upload-menu" id="uploadMenu" hidden>
              <button id="uploadTracksButton" type="button">TRACKS</button>
              <button id="uploadAlbumButton" type="button">ALBUM FOLDER</button>
            </div>
            <div class="search-row" id="searchRow" hidden>
              <input id="librarySearch" type="search" autocomplete="off" placeholder="ТРЕК, ИСПОЛНИТЕЛЬ, АЛЬБОМ" aria-label="Поиск по библиотеке">
            </div>
            <div class="library-view-tabs" id="libraryViewTabs" role="tablist" aria-label="Отображение библиотеки">
              <button type="button" role="tab" data-view="tracks" aria-selected="true">TRACKS</button>
              <button type="button" role="tab" data-view="albums" aria-selected="false">ALBUMS</button>
            </div>
            <div class="library-tabs" id="libraryTabs" role="tablist" aria-label="Фильтр библиотеки">
              <button type="button" role="tab" data-filter="all" aria-selected="true">ALL</button>
              <button class="favorites-tab" type="button" role="tab" data-filter="favorites" aria-label="Избранное" title="Избранное" aria-selected="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2 4.3 13A5.1 5.1 0 0 1 11.5 5.8l.5.5.5-.5A5.1 5.1 0 0 1 19.7 13Z"/></svg>
              </button>
              <button type="button" role="tab" data-filter="happy" aria-selected="false">JOY</button>
              <button type="button" role="tab" data-filter="calm" aria-selected="false">CALM</button>
              <button type="button" role="tab" data-filter="sad" aria-selected="false">SAD</button>
              <button type="button" role="tab" data-filter="romantic" aria-selected="false">LOVE</button>
            </div>
            <ol class="track-list" id="trackList"></ol>
          </div>
          <div class="delete-confirm" id="deleteConfirm" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle" hidden>
            <strong id="deleteConfirmTitle">ВЫ ХОТИТЕ УДАЛИТЬ ЭТОТ ТРЕК?</strong>
            <span id="deleteConfirmName"></span>
            <div>
              <button id="deleteCancel" type="button">НЕТ</button>
              <button id="deleteConfirmButton" type="button">ДА</button>
            </div>
          </div>
        </div>

        <div class="wheel" aria-label="Управление плеером">
          <button class="wheel-btn wheel-vol-up" id="volUp" aria-label="Увеличить громкость">＋</button>
          <button class="wheel-btn wheel-prev" id="prev" aria-label="Предыдущий трек"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 8 12l11 7V5Z"/></svg></button>
          <button class="wheel-btn wheel-play" id="play" aria-label="Воспроизвести или поставить на паузу">
            <span class="play-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5 18.5 12 8 18.5Z"/></svg></span>
            <span class="pause-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.5 5.5h3.2v13H7.5zM13.3 5.5h3.2v13h-3.2z"/></svg></span>
          </button>
          <button class="wheel-btn wheel-next" id="next" aria-label="Следующий трек"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l11 7-11 7V5Z"/></svg></button>
          <button class="wheel-btn wheel-vol-down" id="volDown" aria-label="Уменьшить громкость">−</button>
        </div>
      </div>
    </section>

    <audio id="audio" preload="metadata"></audio>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
